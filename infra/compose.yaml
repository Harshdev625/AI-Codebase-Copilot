
# AI Codebase Copilot — full-stack compose
# Dev mode:        docker compose up infra         (services only, apps run locally)
# Production mode: docker compose --profile prod up (all services + backend + worker + frontend)

services:
  # ─────────────────────────────────────────
  # Infrastructure services (always started)
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aicc}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aicc-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aicc.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: aicc-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aicc-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: aicc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Application services (profile: prod)
  # ─────────────────────────────────────────
  api:
    profiles: [prod]
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: aicc-api
    env_file:
      - ../backend/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    profiles: [prod]
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: aicc-worker
    command: ["python", "run_worker.py"]
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: [prod]
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: aicc-frontend
    env_file:
      - ../frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000/v1
      API_INTERNAL_URL: http://api:8000/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:
  qdrant_data:
  redis_data:
  ollama_data:
